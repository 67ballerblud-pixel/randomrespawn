name: DillyyRandomSpawn
version: 1.0.0
main: com.dillyysmp.randomspawn.RandomSpawnPlugin
api-version: '1.21'
author: DillyySMP
description: Random safe spawn within the world border, on first join and on respawn without a bed.

commands:
  rspawn:
    description: Manually random-teleport yourself, or reload the config.
    usage: /rspawn [reload]
    permission: randomspawn.use

permissions:
  randomspawn.use:
    description: Allows manual random teleport and reload
    default: op
  randomspawn.bypass:
    description: Exempts a player from forced random spawn on join/respawn
    default: false
